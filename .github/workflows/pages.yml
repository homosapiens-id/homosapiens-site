name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/validate_static.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate
        run: |
          python tests/validate_static.py
          node --check site/assets/portal.js
      - name: Build allowlisted artifact
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp site/assets/portal.css _site/assets/portal.css
          cp site/assets/portal.js _site/assets/portal.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
