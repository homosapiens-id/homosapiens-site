name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/validate_static.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on:
      group: hs-production
      labels: [self-hosted, autorun]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify self-hosted toolchain
        run: |
          python3 --version
          node --version
      - name: Validate
        run: |
          python3 tests/validate_static.py
          node --check site/assets/portal.js
      - name: Build allowlisted artifact
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp site/privacy.html _site/privacy.html
          cp site/assets/portal.css _site/assets/portal.css
          cp site/assets/portal.js _site/assets/portal.js
      - name: Ensure GNU tar for Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gtar >/dev/null 2>&1; then
            brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          fi
          command -v gtar
          gtar --version | head -1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
