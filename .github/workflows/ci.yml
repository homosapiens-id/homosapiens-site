name: Site CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, autorun]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify self-hosted toolchain
        run: |
          python3 --version
          node --version
      - run: python3 tests/validate_static.py
      - run: node --check site/assets/portal.js
